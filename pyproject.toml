[project]
name = "principal-agent-benchmarks"
version = "0.1.0"
description = "Replication package for \"Welfare, Improvability, and Variance: A Principal-Agent Approach to Optimal Benchmark Item Aggregation\" (NeurIPS 2026, Evaluations & Datasets Track)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Andreas Haupt" },
    { name = "Justin Hartenstein" },
    { name = "Anka Reuel" },
    { name = "Mykel J. Kochenderfer" },
    { name = "Sanmi Koyejo" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
refresh-judge = [
    # Only needed for `make refresh-judge`, which re-runs the LLM-as-judge.
    "litellm>=1.50",
    "lm-eval>=0.4.5",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/stair-lab/principal-agent-benchmarks"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
